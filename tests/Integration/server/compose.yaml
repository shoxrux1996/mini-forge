# docker compose -f tests/Integration/server/compose.yaml up -d --build
# SSH: 127.0.0.1:2222 as "deploy". HTTP/HTTPS: 8880/8443.
name: mini-forge-test-server

services:
  vps:
    build: .
    hostname: test-vps
    # systemd and the nested Docker Engine need these.
    privileged: true
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Docker's data must not sit on this container's own overlay
      # filesystem (overlay on overlay fails).
      - docker:/var/lib/docker
      - containerd:/var/lib/containerd
    tmpfs: [/run, /run/lock]
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:8880:80"
      - "127.0.0.1:8443:443"
      # A registry inside the server for deployment tests (see README).
      - "127.0.0.1:5000:5000"

volumes:
  docker:
  containerd:
